name: Verify reproduction and site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay RFPSC and verify the versioned evidence
        run: |
          python papers/rfpsc-linear/run.py
          git diff --exit-code -- papers/rfpsc-linear/results
      - name: Build the catalog and paper pages
        run: node scripts/build.mjs
